[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobpilot"
version = "0.1.0"
description = "Personal job-application pipeline: discover, score, tailor, review, apply, track."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.12",
    "httpx>=0.27",
    "jinja2>=3.1",
    "playwright>=1.45",
    "pydantic>=2.6",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jobpilot = "jobpilot.cli:main"

[tool.setuptools.packages.find]
include = ["jobpilot*"]

[tool.setuptools.package-data]
jobpilot = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
