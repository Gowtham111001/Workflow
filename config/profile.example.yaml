# Everything application forms ask for. `jobpilot init` copies this to data/profile.yaml (git-ignored).
# Leave a field empty (null) rather than guessing: unanswered *required* questions are
# queued in data/pending_questions.yaml for you instead of being made up.

personal:
  first_name: Jane
  last_name: Doe
  preferred_name: null
  email: jane.doe@example.com
  phone: "+1 555 010 0000"
  pronouns: null
  address:
    street: null
    city: New York
    state: NY
    postal_code: "10001"
    country: United States

links:
  linkedin: https://www.linkedin.com/in/janedoe
  github: https://github.com/janedoe
  portfolio: null
  website: null

work_authorization:
  authorized_countries: ["United States"]
  requires_sponsorship: false
  status: Citizen

preferences:
  desired_salary: "Open / market rate"
  notice_period: "2 weeks"
  earliest_start_date: "2 weeks after offer"
  willing_to_relocate: true
  years_of_experience: 4

# Voluntary self-identification (EEO). Defaults decline; set only what you choose to share.
demographics:
  gender: Decline to self-identify
  race_ethnicity: Decline to self-identify
  hispanic_latino: Decline to self-identify
  veteran_status: I don't wish to answer
  disability_status: I don't wish to answer

# Answer bank: a distinctive fragment of a question -> your answer. Matched (case-insensitive)
# as a substring of the form label and checked BEFORE anything else, so it also overrides
# the built-in rules. Move answers here from data/pending_questions.yaml as they come up.
answers:
  "how did you hear": "Company careers page"
  "privacy": "Yes"                         # GDPR / privacy-notice consent checkboxes
  "previously worked for": "No"
  "previously been employed by": "No"
  "require sponsorship": "No"
  "at least 18 years": "Yes"
  "background check": "Yes"
