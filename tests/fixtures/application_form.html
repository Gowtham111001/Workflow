<!doctype html>
<html>
<head><meta charset="utf-8"><title>Apply: Backend Engineer at Globex</title></head>
<body>
<h1>Backend Engineer</h1>
<form id="application" onsubmit="event.preventDefault(); document.body.innerHTML = '<h1>Thank you for applying!</h1>';">
  <div><label for="first_name">First Name *</label><input id="first_name" name="first_name" required></div>
  <div><label for="last_name">Last Name *</label><input id="last_name" name="last_name" required></div>
  <div><label for="email">Email *</label><input id="email" type="email" name="email" required></div>
  <div><label for="phone">Phone</label><input id="phone" type="tel" name="phone"></div>
  <div><label for="resume">Resume/CV *</label><input id="resume" type="file" name="resume" required></div>
  <div><label for="linkedin">LinkedIn Profile</label><input id="linkedin" name="urls[LinkedIn]"></div>

  <div class="field">
    <div class="label">How did you hear about this job? *</div>
    <select name="source" required>
      <option value="">Select...</option><option>LinkedIn</option><option>Company careers page</option><option>Referral</option>
    </select>
  </div>

  <fieldset>
    <legend>Will you now or in the future require visa sponsorship? *</legend>
    <label><input type="radio" name="sponsorship" value="1" required> Yes</label>
    <label><input type="radio" name="sponsorship" value="0"> No</label>
  </fieldset>

  <!-- react-select style dropdown with an invisible "required" twin input, as on Greenhouse -->
  <div class="field">
    <label for="relocate_cb">Are you open to relocation? *</label>
    <input id="relocate_cb" role="combobox" aria-controls="relocate_list" autocomplete="off">
    <input id="relocate_required" aria-hidden="true" tabindex="-1" required style="opacity:0;width:10px">
    <ul id="relocate_list" role="listbox" hidden><li role="option">Yes</li><li role="option">No</li></ul>
  </div>

  <!-- upload widget whose input is only labelled "Attach" -->
  <div class="field">
    <div class="label">Cover Letter</div>
    <button type="button">Attach</button><label style="display:none" for="cl_file">Attach</label>
    <input id="cl_file" type="file" style="width:1px;height:1px;opacity:0">
  </div>

  <div><label for="why">Why do you want to work at Globex? *</label><textarea id="why" name="why" required></textarea></div>

  <div><label for="gender">Gender</label>
    <select id="gender" name="gender"><option value="">Select...</option><option>Male</option><option>Female</option>
      <option>I don't wish to answer</option></select></div>

  <div><label><input type="checkbox" name="privacy" required> I have read the privacy notice *</label></div>
  <input type="hidden" name="token" value="x">
  <button type="submit">Submit application</button>
</form>
<script>
  const cb = document.getElementById('relocate_cb'), list = document.getElementById('relocate_list');
  cb.addEventListener('click', () => { list.hidden = false; });
  cb.addEventListener('keydown', e => { if (e.key === 'Escape') list.hidden = true; });
  cb.addEventListener('input', () => {
    list.hidden = false;
    for (const li of list.children) li.hidden = !li.textContent.toLowerCase().startsWith(cb.value.toLowerCase());
  });
  for (const li of list.children) li.addEventListener('click', () => {
    cb.value = li.textContent; cb.dataset.selected = li.textContent; list.hidden = true;
    document.getElementById('relocate_required').value = li.textContent;
  });
</script>
</body>
</html>
